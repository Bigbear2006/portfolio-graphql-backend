        Помимо этого я занимаюсь доработкой frontend и backend сайта.
      type: COMMERCIAL
      url: https://prime-electronics.ru
      role: MAINTENANCE

    - name: Нейрошеф
      description: Telegram Web App для помощи в управлении рестораном и кухней.
      problem: |
        У шеф-повара много задач, которые можно автоматизировать или делегировать
        (составление меню, графиков смен, анализ поставщиков).
        Нужен бот, который не просто ищет информацию, а составляет полноценные документы.
        Важен и формат данных: бот должен принимать не только текст, но и голосовые
        сообщения, фото и файлы, а в ответ присылать готовые PDF и Excel.
      solution: |
        Сделал Telegram Web App с ИИ-ассистентом. Он принимает текст, голос, фото
        и файлы, а в ответ присылает текст или готовые PDF и Excel.
        Реализовал подписку с тестовым периодом и оплатой через ЮKassa.
        В Mini App можно посмотреть все файлы, которые отправил бот, управлять подпиской и настройками.
      type: COMMERCIAL
      role: SOLO

    - name: ClassFlow
      description: Сайт для управления организациями дополнительного образования.
      problem: |
        Создать сайт где любой пользователь может создать свою организацию, добавлять курсы и группы,
        составлять расписание и контролировать посещаемость и оплаты.
        Сайт ориентирован на небольшие организации дополнительного образования.
        С технической стороны надо предусмотреть изоляцию данных различных организаций и права доступа,
        а также необходимо собирать базовые метрики - количество запросов, время ответа и т.д.
      solution: |
        Сделал мультитенантную платформу с четырьмя ролями (владелец, администратор,
        учитель, ученик) и разными правами доступа. Реализовал управление участниками,
        групповыми и индивидуальными курсами, расписанием, посещаемостью и оплатами,
        а также регистрацию с подтверждением почты. Изоляцию данных организаций
        обеспечил на уровне БД через Row-Level Security. Файлы хранятся в S3,
        метрики собираются в Prometheus и показываются в Grafana.
      type: PET
      url: https://classflow.ru
      github: https://github.com/Bigbear2006/classflow
      role: SOLO

    - name: DOM KIT
      description: Telegram-бот для подбора квартир в жилом комплексе.
      problem: |
        У заказчика есть сайт, но он ищет дополнительные источники клиентов.
        Нужен бот, в котором квартиры в жилом комплексе можно искать не только
        по фильтрам, но и визуально, по картинкам, а заявки и вопросы должны попадать в CRM.
      solution: |
        Сделал Telegram-бота с поиском по фильтрам и визуальным выбором очереди,
        секции и этажа по картинкам. Квартиры можно добавлять в избранное и подписываться
        на их изменения (например, цены) с уведомлениями. В боте есть новости и акции,
        а заявки и вопросы автоматически уходят в Bitrix. Каждый медиафайл загружается
        на сервера Telegram один раз и дальше отправляется по file_id, поэтому бот
        отвечает быстро и не загружает файлы повторно.
      type: COMMERCIAL
      role: SOLO

    - name: Telegram Bot Template
      description: Шаблон Telegram-бота c админ-панелью и готовым деплоем.
      problem: |
        В начале разработки каждого нового бота я копировал много повторяющегося кода
        из предыдущих проектов. Поэтому решил собрать всё, что повторяется
        во всех моих Telegram-ботах, в одном шаблоне.
      solution: |
        Собрал стартовый шаблон на aiogram и Django с админ-панелью, фоновыми задачами
        на Celery и Redis, а также Docker, Nginx и настроенным CI/CD
        для автоматического деплоя. Добавил ruff для линтинга, строгую типизацию mypy
        и готовые middleware и фильтры. Достаточно клонировать репозиторий, чтобы
        получить рабочую основу для нового проекта, это намного ускоряет начало разработки.
      type: PET
      github: https://github.com/Bigbear2006/aiogram-django-template
      role: SOLO
