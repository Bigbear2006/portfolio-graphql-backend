  projects:
    - name: Prime Electronics
      description: Интернет-магазин техники.
      problem: |
        У интернет-магазина большой каталог техники, в котором нужно поддерживать актуальные цены.
        Цены постоянно меняются, а ручное обновление занимает много времени.
